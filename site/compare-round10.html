function select(r){$('#reference').pause();$('#replica').pause();selected=r;location.hash=r.experiment_id;$('#title').textContent=r.title;$('#metadata').textContent=`${r.experiment_id} · ${r.category} · ${r.width}×${r.height} · ${r.fps} fps · ${(r.durationInFrames/r.fps).toFixed(2)} 秒`;$('#reference').src=r.reference;$('#reference').poster=r.poster;$('#seek').max=r.durationInFrames-1;$('#seek').value=0;result();draw();}
async function poll(){await Promise.all(rows.map(async r=>{if(done.has(r.experiment_id)||blocked.has(r.experiment_id))return;try{const a=await fetch(r.completion,{cache:'no-store'});if(!a.ok)return;const data=await a.json();if(/blocked|failed|error/i.test(data.status||'')){blocked.add(r.experiment_id);return;}const h=await fetch(r.replica,{method:'HEAD',cache:'no-store'});if(h.ok&&Number(h.headers.get('content-length'))>1000)done.add(r.experiment_id);}catch(e){}}));result();draw();}
function seekVideos(frame){const t=Math.max(0,Math.min(selected.durationInFrames-1,frame))/selected.fps;$('#reference').currentTime=t;if(done.has(selected.experiment_id))$('#replica').currentTime=t;}
$('#seek').oninput=()=>seekVideos(Number($('#seek').value));$('#prev').onclick=()=>seekVideos(Math.round($('#reference').currentTime*selected.fps)-1);$('#next').onclick=()=>seekVideos(Math.round($('#reference').currentTime*selected.fps)+1);$('#play').onclick=()=>{const a=$('#reference'),b=$('#replica');if(a.paused){if(done.has(selected.experiment_id)){b.currentTime=a.currentTime;b.play().catch(()=>{});}a.play().catch(()=>{});}else{a.pause();b.pause();}};$('#reference').ontimeupdate=()=>{$('#seek').value=Math.round($('#reference').currentTime*selected.fps);$('#time').textContent=$('#reference').currentTime.toFixed(2)+' s';};$('#category').onchange=draw;select(selected);poll();setInterval(poll,15000);
</script><script src="round10-review.js"></script></html>
