<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>0.999… = 1 · 标准流程复刻</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#101722;color:#edf1f8;font:16px/1.6 system-ui,-apple-system,sans-serif}main{max-width:1500px;margin:auto;padding:30px 24px}h1{font-size:29px;margin:0 0 9px}p{color:#aebdd2}nav{display:flex;gap:18px;margin:20px 0}a{color:#9ebfff}section{background:#172233;border:1px solid #33445e;border-radius:16px;padding:22px;margin:24px 0}h2{margin:0;font-size:24px}.meta{color:#9fb1cc;font-size:14px}.videos{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:18px}h3{font-size:15px;margin:0 0 8px}video{display:block;width:100%;aspect-ratio:16/9;background:black;border-radius:8px}.controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:15px 0}button{padding:9px 13px;border:1px solid #4c6795;background:#283c5d;color:#edf1f8;border-radius:7px;cursor:pointer}input{flex:1;min-width:170px}.score-grid{display:grid;grid-template-columns:220px 1fr;gap:22px;margin-top:20px}.total{font-size:53px;color:#a9c3ff;font-weight:700}.state{color:#d7b18d}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:10px;border-bottom:1px solid #33445e}th{color:#b5c6dd}.evidence{max-height:500px;overflow:auto}details{padding:11px 0;border-bottom:1px solid #33445e}summary{cursor:pointer}pre{font-size:12px;white-space:pre-wrap;overflow-wrap:anywhere;background:#0e1725;padding:15px}.notes li{margin:8px 0}@media(max-width:800px){main{padding:20px 14px}.videos,.score-grid{grid-template-columns:1fr}section{padding:17px}.total{font-size:44px}}
</style>
<main><p><a href="../../index.html">返回其他复刻案例</a></p><h1>0.999… = 1：复刻与评分</h1><p>参考源码用于生成隐藏评分规则；独立子 agent 根据视频、对象卡片与音频素材完成复刻，提交源码和视频后自动评分。</p><nav><a href="#nines-equals-one">0.999… = 1 · 96 秒</a></nav><div id="cases"><p>正在读取结果。</p></div></main>
<script>
async function readChecks(url){
 const response=await fetch(url);if(!response.ok)throw Error('评分明细读取失败');
 if(!url.endsWith('.gz'))return response.json();
 if(!('DecompressionStream' in window))throw Error('请使用新版 Chrome 或下载逐项数据后解压查看');
 return new Response(response.body.pipeThrough(new DecompressionStream('gzip'))).json();
}
const labels={presence:'元素存在',attributes:'元素属性',relations:'相对关系',binding:'动效绑定',motion:'运动参数',timing:'进出时序'};
const node=(tag,text,cls)=>{const e=document.createElement(tag);if(text!=null)e.textContent=text;if(cls)e.className=cls;return e};
function video(url,label,poster){const box=node('div');box.append(node('h3',label));if(url){const v=node('video');v.src=url;if(poster)v.poster=poster;v.controls=true;v.preload='metadata';v.playsInline=true;v.setAttribute('aria-label',label);box.append(v)}else box.append(node('p','视频尚未提交。','state'));return box}
function controls(section,a,b,duration,fps,chapters=[]){let running=false;const row=node('div',null,'controls'),play=node('button','同步播放'),back=node('button','− 1 帧'),next=node('button','＋ 1 帧'),seek=node('input'),clock=node('span',`0.00 / ${duration.toFixed(2)} s`);seek.type='range';seek.min=0;seek.max=duration-1/fps;seek.step=1/fps;seek.value=0;seek.setAttribute('aria-label','同步播放进度');row.append(play,back,next,seek,clock);section.append(row);b.muted=true;
 const stop=()=>{a.pause();b.pause();running=false;play.textContent='同步播放'};
 const jump=t=>{stop();a.currentTime=Math.max(0,Math.min(duration-1/fps,t));b.currentTime=a.currentTime;seek.value=a.currentTime;clock.textContent=`${a.currentTime.toFixed(2)} / ${duration.toFixed(2)} s`};
 play.onclick=async()=>{if(running){stop();return}if(a.currentTime>=duration-1/fps)jump(0);b.currentTime=a.currentTime;try{await Promise.all([a.play(),b.play()]);running=true;play.textContent='暂停'}catch(err){stop();clock.textContent='请分别点击播放器播放'}};back.onclick=()=>jump(a.currentTime-1/fps);next.onclick=()=>jump(a.currentTime+1/fps);seek.oninput=()=>jump(Number(seek.value));a.onended=stop;
 if(chapters.length){const tabs=node('div',null,'controls');for(const chapter of chapters){const button=node('button',chapter.title);button.onclick=()=>jump(chapter.time);tabs.append(button)}section.append(tabs)}
 const tick=()=>{if(running){if(Math.abs(a.currentTime-b.currentTime)>.08)b.currentTime=a.currentTime;seek.value=a.currentTime;clock.textContent=`${a.currentTime.toFixed(2)} / ${duration.toFixed(2)} s`}requestAnimationFrame(tick)};tick();
}
fetch('results.json').then(r=>{if(!r.ok)throw Error('尚未生成结果');return r.json()}).then(data=>{const root=document.querySelector('#cases');root.replaceChildren();for(const item of data.cases){const section=node('section');section.id=item.id;section.append(node('h2',item.title),node('p',`${item.duration} 秒 · ${item.width}×${item.height} · ${item.fps} fps`,'meta'));if(item.source_url){const source=node('a','参考来源');source.href=item.source_url;source.target='_blank';source.rel='noopener';section.append(source)}if(item.source_note)section.append(node('p',item.source_note,'meta'));const vs=node('div',null,'videos');vs.append(video(item.reference_video,'原视频',item.reference_poster),video(item.replica_video,'子 agent 复刻',item.replica_poster));section.append(vs);const vids=vs.querySelectorAll('video');if(vids.length===2)controls(section,vids[0],vids[1],item.duration,item.fps,item.chapters);
 const score=item.score;if(score){const grid=node('div',null,'score-grid'),total=node('div');total.append(node('div',score.total==null?'未完成':Number(score.total).toFixed(2),'total'),node('strong','源码自动评分 / 100'),node('p',`${score.checks_resolved} / ${score.checks_total} 项已解析`,'meta'));grid.append(total);const table=node('table'),head=node('tr');['维度','分数','权重'].forEach(t=>head.append(node('th',t)));table.append(head);for(const [key,label] of Object.entries(labels)){const row=node('tr');row.append(node('td',label),node('td',score.dimensions?.[key]==null?'未解析':Number(score.dimensions[key]).toFixed(2)),node('td',score.dimension_weights?.[key]==null?'—':`${Math.round(score.dimension_weights[key]*100)}%`));table.append(row)}grid.append(table);section.append(grid)}else section.append(node('p',item.status||'正在生成评分任务。','state'));
 if(item.scope_display||item.scope)section.append(node('p',item.scope_display||item.scope,'meta'));if(item.score?.status && item.score.status!=='valid')section.append(node('p','此结果尚未形成有效总分；请查看未解析项及评分证据。','state'));if(item.validation)section.append(node('p',item.validation,'meta'));if(item.score_note)section.append(node('p',item.score_note,'state'));if(item.findings?.length){const ul=node('ul',null,'notes');item.findings.forEach(t=>ul.append(node('li',t)));section.append(ul)}
 if(item.score_file){const row=node('p');for(const [url,label] of [[item.score_file,'完整评分与输入指纹'],[item.checks_file,'下载逐项数据（gzip）'],['evidence/oracle-validation.json','标准解验收记录']]){const link=node('a',label);link.href=url;row.append(link,document.createTextNode('　'))}section.append(row)}
 if(item.code_file){const row=node('p'),link=node('a','查看关键源码差异');link.href=item.code_file;row.append(link);section.append(row)}
 if(item.object_scores_file){const group=node('details');group.append(node('summary','按对象查看六维分数（73 个）'));section.append(group);let loaded=false;group.ontoggle=()=>{if(!group.open||loaded)return;loaded=true;fetch(item.object_scores_file).then(r=>r.json()).then(({objects})=>{const search=node('input');search.type='search';search.placeholder='搜索对象名称或编号';search.setAttribute('aria-label','搜索对象');search.style.cssText='padding:9px;margin:14px 0;width:100%;background:#0e1725;color:#edf1f8;border:1px solid #4c6795;border-radius:7px';const wrap=node('div');wrap.style.overflowX='auto';const table=node('table'),head=node('tr');['对象',...Object.values(labels)].forEach(text=>{const th=node('th',text);th.scope='col';head.append(th)});table.append(head);for(const obj of objects){const row=node('tr');row.dataset.query=(obj.name+' '+obj.id).toLowerCase();const name=node('td');name.append(node('strong',obj.name),node('div',obj.id,'meta'));row.append(name);for(const key of Object.keys(labels)){const value=obj.dimensions[key],cell=node('td',value==null?'未解析':Number(value).toFixed(1));cell.style.color=value<40?'#ffb2ae':value<80?'#e4c08b':'#83d8c4';row.append(cell)}table.append(row)}search.oninput=()=>{const query=search.value.trim().toLowerCase();for(const row of table.querySelectorAll('tr[data-query]'))row.hidden=!row.dataset.query.includes(query)};wrap.append(table);group.append(search,wrap)}).catch(e=>group.append(node('p',String(e))))}};
 if(item.checks_file){const details=node('details');details.append(node('summary','查看逐项评分与源码证据'));const body=node('div',null,'evidence');details.append(body);section.append(details);let loaded=false;details.ontoggle=()=>{if(!details.open||loaded)return;loaded=true;readChecks(item.checks_file).then(raw=>{const checks=Array.isArray(raw)?raw:raw.checks||[];checks.sort((a,b)=>(a.score_100??a.score??100)-(b.score_100??b.score??100));for(const c of checks){const d=node('details');d.append(node('summary',`${c.object_id||c.id} · ${c.description||c.property||c.dimension}：${c.score_100??c.score??'未解析'}`));let shown=false;d.ontoggle=()=>{if(d.open&&!shown){shown=true;d.append(node('pre',JSON.stringify(c,null,2)))}};body.append(d)}}).catch(e=>body.append(node('p',String(e))))}}
 root.append(section)}}).catch(e=>document.querySelector('#cases').replaceChildren(node('p',String(e),'state')));
</script></html>
