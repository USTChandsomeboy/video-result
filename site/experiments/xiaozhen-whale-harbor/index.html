<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>小镇姑娘 · 鲸鱼娘 MV 复刻</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#101722;color:#edf1f8;font:16px/1.6 system-ui,-apple-system,sans-serif}main{max-width:1500px;margin:auto;padding:30px 24px}h1{font-size:29px;margin:0 0 9px}p{color:#aebdd2}nav{display:flex;flex-wrap:wrap;gap:18px;margin:20px 0}a{color:#9ebfff}section{background:#172233;border:1px solid #33445e;border-radius:16px;padding:22px;margin:24px 0}h2{margin:0;font-size:24px}.meta{color:#9fb1cc;font-size:14px}.videos{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:18px}h3{font-size:15px;margin:0 0 8px}video{display:block;width:100%;aspect-ratio:16/9;background:black;border-radius:8px}.controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:15px 0}button{padding:9px 13px;border:1px solid #4c6795;background:#283c5d;color:#edf1f8;border-radius:7px;cursor:pointer}input{flex:1;min-width:170px}.score-grid{display:grid;grid-template-columns:220px 1fr;gap:22px;margin-top:20px}.total{font-size:53px;color:#a9c3ff;font-weight:700}.state{color:#d7b18d}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:10px;border-bottom:1px solid #33445e}th{color:#b5c6dd}.evidence{max-height:500px;overflow:auto}details{padding:11px 0;border-bottom:1px solid #33445e}summary{cursor:pointer}pre{font-size:12px;white-space:pre-wrap;overflow-wrap:anywhere;background:#0e1725;padding:15px}.notes li{margin:8px 0}@media(max-width:800px){main{padding:20px 14px}.videos,.score-grid{grid-template-columns:1fr}section{padding:17px}.total{font-size:44px}}
</style>
<main><p><a href="../../index.html">返回其他复刻案例</a></p><h1>小镇姑娘：鲸鱼娘 MV 复刻与评分</h1><p>子 agent 根据参考视频、对象卡片和允许素材独立复刻。提交源码与视频后，由独立评分器比较对象、属性和动作过程。</p><nav><a href="#xiaozhen-whale">原作与复刻</a><a href="README.md">实验说明</a><a href="evidence/scorer-corrections.md">评分器修正记录</a><a href="replica/src/Replica.tsx">复刻源码</a></nav><div id="cases"><p>正在读取结果。</p></div></main>
<script>
const labels={presence:'元素存在',attributes:'元素属性',relations:'相对关系',binding:'动效绑定',motion:'运动参数',timing:'进出时序'};
const node=(tag,text,cls)=>{const e=document.createElement(tag);if(text!=null)e.textContent=text;if(cls)e.className=cls;return e};
function video(url,label,poster){const box=node('div');box.append(node('h3',label));if(url){const v=node('video');v.src=url;if(poster)v.poster=poster;v.controls=true;v.preload='metadata';v.playsInline=true;v.setAttribute('aria-label',label);box.append(v)}else box.append(node('p','视频尚未提交。','state'));return box}
function controls(section,a,b,duration,fps){let running=false,starting=false,playbackToken=0;const row=node('div',null,'controls'),play=node('button','同步播放'),back=node('button','− 1 帧'),next=node('button','＋ 1 帧'),seek=node('input'),clock=node('span',`0.00 / ${duration.toFixed(2)} s`);seek.type='range';seek.min=0;seek.max=duration-1/fps;seek.step=1/fps;seek.value=0;seek.setAttribute('aria-label','同步视频时间');row.append(play,back,next,seek,clock);section.append(row);b.muted=true;
 const stop=()=>{playbackToken++;a.pause();b.pause();running=false;starting=false;play.textContent='同步播放'};
 const jump=t=>{stop();a.currentTime=Math.max(0,Math.min(duration-1/fps,t));b.currentTime=a.currentTime;seek.value=a.currentTime;clock.textContent=`${a.currentTime.toFixed(2)} / ${duration.toFixed(2)} s`};
 const examples=node('div',null,'controls');for(const [time,label] of [[.8,'0.8s · 逐字歌词'],[4.6,'4.6s · 女孩离开'],[10.5,'10.5s · 风筝绳'],[23.5,'23.5s · 星座描边']]){const button=node('button',label);button.onclick=()=>jump(time);examples.append(button)}section.append(examples);
 play.onclick=async()=>{if(running||starting){stop();return}if(a.currentTime>=duration-1/fps)jump(0);b.currentTime=a.currentTime;const token=++playbackToken;starting=true;play.textContent='暂停';try{await Promise.all([a.play(),b.play()]);if(token!==playbackToken)return;starting=false;running=true}catch(err){if(token!==playbackToken)return;stop();clock.textContent='请分别点击播放器播放'}};back.onclick=()=>jump(a.currentTime-1/fps);next.onclick=()=>jump(a.currentTime+1/fps);seek.oninput=()=>jump(Number(seek.value));a.onended=stop;
 const tick=()=>{if(running){if(Math.abs(a.currentTime-b.currentTime)>.08)b.currentTime=a.currentTime;seek.value=Math.min(duration-1/fps,a.currentTime);clock.textContent=`${Math.min(duration,a.currentTime).toFixed(2)} / ${duration.toFixed(2)} s`}requestAnimationFrame(tick)};tick();
}
function renderChecks(body,checks){
 checks.sort((a,b)=>(a.score_100??a.score??100)-(b.score_100??b.score??100));
 const filters=node('div',null,'controls'),object=node('select'),dimension=node('select'),count=node('p',null,'meta'),list=node('div'),more=node('button','再显示 50 项');
 object.setAttribute('aria-label','按对象筛选检查项');dimension.setAttribute('aria-label','按评分维度筛选检查项');
 const option=(select,value,label)=>{const o=node('option',label);o.value=value;select.append(o)};
 option(object,'','全部对象');for(const [id,name] of new Map(checks.map(c=>[c.object_id,c.object_name||c.object_id])))option(object,id,name);
 option(dimension,'','全部维度');for(const [key,label] of Object.entries(labels))option(dimension,key,label);
 filters.append(object,dimension);body.append(filters,count,list,more);let limit=50;
 const show=()=>{const selected=checks.filter(c=>(!object.value||c.object_id===object.value)&&(!dimension.value||c.dimension===dimension.value));list.replaceChildren();count.textContent=`共 ${selected.length} 项，显示 ${Math.min(limit,selected.length)} 项；按分数从低到高排列。`;
  for(const c of selected.slice(0,limit)){const d=node('details');const score=c.score_100??c.score;d.append(node('summary',`${c.object_name||c.object_id} · ${c.description_display||c.description||c.property}：${score==null?'未解析':Number(score).toFixed(1)}`));d.ontoggle=()=>{if(d.open&&!d.querySelector('pre'))d.append(node('pre',JSON.stringify(c,null,2)))};list.append(d)}more.hidden=selected.length<=limit};
 object.onchange=dimension.onchange=()=>{limit=50;show()};more.onclick=()=>{limit+=50;show()};show();
}
fetch('results.json').then(r=>{if(!r.ok)throw Error('尚未生成结果');return r.json()}).then(data=>{const root=document.querySelector('#cases');root.replaceChildren();for(const item of data.cases){const section=node('section');section.id=item.id;section.append(node('h2',item.title),node('p',`${item.duration} 秒 · ${item.width}×${item.height} · ${item.fps} fps`,'meta'));if(item.source_url){const source=node('a','参考来源');source.href=item.source_url;source.target='_blank';source.rel='noopener';section.append(source)}if(item.source_note)section.append(node('p',item.source_note,'meta'));const vs=node('div',null,'videos');vs.append(video(item.reference_video,'原视频',item.reference_poster),video(item.replica_video,'子 agent 复刻',item.replica_poster));section.append(vs);const vids=vs.querySelectorAll('video');if(vids.length===2)controls(section,vids[0],vids[1],item.duration,item.fps);
 const score=item.score;if(score){const grid=node('div',null,'score-grid'),total=node('div');total.append(node('div',score.total==null?'未完成':Number(score.total).toFixed(2),'total'),node('strong','源码自动评分 / 100'),node('p',`${score.checks_resolved} / ${score.checks_total} 项已解析`,'meta'));grid.append(total);const table=node('table'),head=node('tr');['维度','分数','权重'].forEach(t=>head.append(node('th',t)));table.append(head);for(const [key,label] of Object.entries(labels)){const row=node('tr');row.append(node('td',label),node('td',score.dimensions?.[key]==null?'未解析':Number(score.dimensions[key]).toFixed(2)),node('td',score.dimension_weights?.[key]==null?'—':`${Math.round(score.dimension_weights[key]*100)}%`));table.append(row)}grid.append(table);section.append(grid)}else section.append(node('p',item.status||'正在生成评分任务。','state'));
 if(item.object_scores_file){const details=node('details');details.append(node('summary','查看各对象的六项评分'));const body=node('div',null,'evidence');details.append(body);section.append(details);let loaded=false;details.ontoggle=()=>{if(!details.open||loaded)return;loaded=true;fetch(item.object_scores_file).then(r=>r.json()).then(rows=>{const table=node('table'),head=node('tr');['对象',...Object.values(labels)].forEach(t=>head.append(node('th',t)));table.append(head);for(const o of rows){const row=node('tr'),name=node('td');name.append(node('strong',o.name),node('div',o.id,'meta'));row.append(name);for(const key of Object.keys(labels))row.append(node('td',o.dimensions[key]==null?'不适用':o.dimensions[key].toFixed(1)));table.append(row)}body.append(table)}).catch(e=>body.append(node('p',String(e))))}}
 if(item.scope_display||item.scope)section.append(node('p',item.scope_display||item.scope,'meta'));if(item.score?.status && item.score.status!=='valid')section.append(node('p','此结果尚未形成有效总分；请查看未解析项及评分证据。','state'));if(item.validation)section.append(node('p',item.validation,'meta'));if(item.score_note)section.append(node('p',item.score_note,'state'));if(item.findings?.length){const ul=node('ul',null,'notes');item.findings.forEach(t=>ul.append(node('li',t)));section.append(ul)}
 if(item.score_file){const link=node('a','完整评分与输入指纹');link.href=item.score_file;section.append(link)}
 if(item.code_file){const row=node('p'),link=node('a','查看关键源码差异');link.href=item.code_file;row.append(link);section.append(row)}
 if(item.checks_file){const details=node('details');details.append(node('summary','查看逐项评分与源码证据'));const body=node('div',null,'evidence');details.append(body);section.append(details);let loaded=false;details.ontoggle=()=>{if(!details.open||loaded)return;loaded=true;fetch(item.checks_file).then(r=>r.json()).then(raw=>renderChecks(body,Array.isArray(raw)?raw:raw.checks||[])).catch(e=>body.append(node('p',String(e))))}}
 root.append(section)}}).catch(e=>document.querySelector('#cases').replaceChildren(node('p',String(e),'state')));
</script></html>
