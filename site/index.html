-analytics-ui", "frames": 360, "fps": 24, "times": [0, 3, 6, 9, 12, 14], "difficulties": [["r19-f01", 0, "Dashboard 初始状态", "参考首屏已有完整股票列表、图表、地图和饼图，复刻部分面板从空状态开始。", "界面初始状态的完整内容没有对齐。", "ui_initial_state"], ["r19-f02", 3, "柱状图更新因果", "参考柱状图、右侧数值和底部图形一起变化，复刻关系被简化。", "数据更新没有同时驱动所有相关组件。", "chart_update_causality"], ["r19-f03", 6, "地图内容身份", "参考地图有具体地理轮廓和指标标记，复刻简化成抽象轮廓。", "复杂 UI 子对象的内容身份没有保持。", "dashboard_identity"], ["r19-f04", 12, "面板数据一致性", "参考多个面板共同表达同一组数据，复刻模块间数字关系不完整。", "同一数据在多个组件之间没有共享状态。", "cross_panel_data_binding"]], "remotion_suitability": "适合", "group": "history"}, {"id": "r20-annual-report-data", "title": "Animated growth chart data infographic", "category": "数据叙事（可视化）", "dir": "experiments/r20-annual-report-data", "frames": 360, "fps": 24, "times": [0, 3, 6, 9, 12, 14], "difficulties": [["r20-f01", 0, "图表初始状态", "参考先显示空坐标框，标题、图例和曲线稍后进入，复刻时间略有偏差。", "图表各层的起始状态没有完全对齐。", "chart_initial_state"], ["r20-f02", 3, "多条曲线绘制", "参考曲线有不同速度和走势，复刻走势和局部波动规则化。", "不同数据序列的独立变化没有保持。", "multi_series_continuity"], ["r20-f03", 6, "图例与曲线绑定", "参考图例、颜色和具体数据序列对应，复刻关系较弱。", "图例没有完全绑定到对应的数据路径。", "annotation_binding"], ["r20-f04", 12, "摘要数字收尾", "参考摘要数字和最终图表同时完成，复刻略有错位。", "最终数据状态和说明数字没有同时完成。", "summary_chart_binding"]], "remotion_suitability": "适合", "group": "history"}];
let examples=[],active,index=0,switching=0;
function setControls(enabled){['play','prev','next','seek'].forEach(id=>$('#'+id).disabled=!enabled)}
function label(){if(!active||!Number.isFinite(ref.currentTime))return;$('#time').textContent=`${ref.currentTime.toFixed(3)} 秒 / 帧 ${Math.round(ref.currentTime*(active.fps||24))}`;$('#seek').value=Math.round(ref.currentTime*(active.fps||24))}
function go(frame){if(!active)return;ref.pause();rec.pause();const t=Math.max(0,Math.min(active.frames-1,frame))/(active.fps||24);ref.currentTime=rec.currentTime=t;label()}
function showMissing(){ref.hidden=true;rec.hidden=true;$('#refPlaceholder').hidden=false;$('#recPlaceholder').hidden=false;setControls(false)}
async function hasFiles(dir){if(location.protocol==='file:')return true;const urls=[`${dir}/reference.mp4`,`${dir}/recreation.mp4`];return (await Promise.all(urls.map(url=>fetch(url,{method:'HEAD'}).then(r=>r.ok).catch(()=>false)))).every(Boolean)}
async function selectExample(i){
  const id=++switching; index=i; active=examples[i];
  ref.pause();rec.pause();
  const dir=active.dir;
  history.replaceState(null,'','#'+active.id);
  $('#source').href=active.source_url||'#';
  $('#source').hidden=!active.source_url;
  $('#summary').textContent=`${active.category}｜${active.title}｜Remotion 适配：${active.remotion_suitability}。${active.audit_note||''}`;
  $('#seek').max=active.frames-1;
  $('#comparison').src=`${dir}/comparison.jpg`;
  $('#report').href=`${dir}/report.md`;
  $('#evidence').replaceChildren(...active.difficulties.map(d=>{const p=document.createElement('p');p.textContent=`${d[1]} 秒｜${d[2]}：${d[3]} 待验证线索：${d[4]}`;return p}));
  $('#jump').replaceChildren(...active.times.map(t=>{const button=document.createElement('button');button.textContent=`跳到 ${t} 秒`;button.onclick=()=>go(t*(active.fps||24));return button}));
  const filesReady=await hasFiles(dir);
  if(id!==switching)return;
  if(!filesReady){showMissing();return}
  ref.src=`${dir}/reference.mp4`;rec.src=`${dir}/recreation.mp4`;
  try{await Promise.all([ref,rec].map(video=>new Promise((resolve,reject)=>{video.addEventListener('loadedmetadata',resolve,{once:true});video.addEventListener('error',reject,{once:true})})))}catch{showMissing();return}
  if(id!==switching)return;
  $('#refPlaceholder').hidden=true;$('#recPlaceholder').hidden=true;ref.hidden=false;rec.hidden=false;setControls(true);go(active.fps||24)
}
function filtered(){return examples.map((item,i)=>({item,i})).filter(({item})=>($('#scope').value==='all'||item.group===$('#scope').value)&&($('#category').value==='all'||item.category===$('#category').value))}
function fillExamples(preferred){const items=filtered();exampleSelect.replaceChildren(...items.map(({item,i})=>{const option=document.createElement('option');option.value=i;option.textContent=`${item.category}｜${item.title}`;return option}));if(!items.length){showMissing();return}const chosen=items.some(x=>x.i===preferred)?preferred:items[0].i;exampleSelect.value=chosen;selectExample(chosen)}
function fillCategories(){const categories=[...new Set(examples.filter(e=>$('#scope').value==='all'||e.group===$('#scope').value).map(e=>e.category))];$('#category').replaceChildren(...['all',...categories].map(c=>{const o=document.createElement('option');o.value=c;o.textContent=c==='all'?'全部类别':c;return o}))}
function populate(){const wanted=examples.findIndex(e=>e.id===decodeURIComponent(location.hash.slice(1)));if(wanted>=0)$('#scope').value=examples[wanted].group||'history';fillCategories();fillExamples(wanted);exampleSelect.onchange=()=>selectExample(+exampleSelect.value);$('#scope').onchange=()=>{fillCategories();fillExamples()};$('#category').onchange=()=>fillExamples()}
window.addEventListener('hashchange',()=>{const wanted=examples.findIndex(e=>e.id===decodeURIComponent(location.hash.slice(1)));if(wanted>=0&&examples[wanted].id!==active?.id){$('#scope').value=examples[wanted].group||'history';fillCategories();fillExamples(wanted)}});
$('#play').onclick=async()=>{if(ref.paused){rec.currentTime=ref.currentTime;await Promise.all([ref.play(),rec.play()])}else{ref.pause();rec.pause()}};
$('#seek').oninput=e=>go(+e.target.value);
$('#prev').onclick=()=>go(Math.round(ref.currentTime*(active.fps||24))-1);
$('#next').onclick=()=>go(Math.round(ref.currentTime*(active.fps||24))+1);
ref.ontimeupdate=()=>{label();if(!ref.paused&&Math.abs(ref.currentTime-rec.currentTime)>.08)rec.currentTime=ref.currentTime};
ref.onended=()=>rec.pause();
(location.protocol==='file:'?Promise.resolve(embeddedExamples):fetch('examples.json').then(r=>r.json())).then(data=>{examples=data;populate()}).catch(()=>{examples=embeddedExamples;populate()});
</script>
