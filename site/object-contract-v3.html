<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>视频复刻与评分结果</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #090c14;
      --panel: rgba(19, 25, 39, .92);
      --panel-2: #151d30;
      --line: #2a3854;
      --line-soft: rgba(150, 172, 213, .14);
      --text: #f0f4ff;
      --muted: #98a7c1;
      --blue: #9dbbff;
      --cyan: #63d6e9;
      --green: #75d8aa;
      --amber: #ffc979;
      --red: #ff8b91;
      --shadow: 0 24px 70px rgba(0, 0, 0, .28);
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(900px 500px at 6% -8%, rgba(73, 114, 197, .2), transparent 65%),
        radial-gradient(700px 480px at 100% 10%, rgba(49, 161, 176, .12), transparent 66%),
        var(--bg);
    }
    button, input { font: inherit; }
    button { color: inherit; }
    .shell { width: min(1540px, calc(100% - 48px)); margin: 0 auto; padding: 38px 0 70px; }
    .hero { display: flex; justify-content: space-between; gap: 32px; align-items: flex-end; margin-bottom: 32px; }
    .eyebrow { color: var(--cyan); letter-spacing: .15em; text-transform: uppercase; font-size: 12px; font-weight: 700; }
    h1 { margin: 10px 0 12px; font-size: clamp(29px, 4vw, 52px); line-height: 1.05; letter-spacing: -.035em; }
    .hero p { color: var(--muted); max-width: 760px; line-height: 1.7; margin: 0; font-size: 15px; }
    .hero-note { min-width: 260px; padding: 16px 18px; border: 1px solid var(--line-soft); background: rgba(17, 24, 39, .68); border-radius: 16px; color: var(--muted); line-height: 1.6; font-size: 13px; }
    .hero-note strong { display: block; color: var(--text); font-size: 22px; letter-spacing: -.02em; }
    .score-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 24px; }
    .score-card { position: relative; overflow: hidden; text-align: left; cursor: pointer; border: 1px solid var(--line-soft); border-radius: 16px; padding: 17px; background: var(--panel); min-height: 148px; transition: .18s ease; }
    .score-card:hover, .score-card.active { border-color: rgba(157, 187, 255, .75); transform: translateY(-2px); box-shadow: 0 12px 30px rgba(42, 69, 125, .2); }
    .score-card.active::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 3px; background: var(--blue); }
    .score-card .kind { color: var(--muted); font-size: 12px; }
    .score-card h3 { margin: 8px 0 14px; font-size: 15px; line-height: 1.35; min-height: 40px; }
    .score-line { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
    .score-value { font-size: 30px; font-weight: 750; letter-spacing: -.04em; }
    .score-value.low { color: var(--amber); }
    .score-value.na { color: #75819a; font-size: 25px; }
    .coverage { color: var(--muted); font-size: 12px; }
    .card-status { color: var(--muted); font-size: 11px; line-height: 1.6; margin-top: 8px; }
    .workspace { display: grid; grid-template-columns: 245px minmax(0, 1fr); gap: 18px; align-items: start; }
    .case-nav, .detail { border: 1px solid var(--line-soft); background: var(--panel); border-radius: 20px; box-shadow: var(--shadow); }
    .case-nav { padding: 12px; position: sticky; top: 18px; }
    .nav-title { color: var(--muted); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; padding: 8px 10px 12px; }
    .nav-item { border: 1px solid transparent; width: 100%; text-align: left; border-radius: 12px; background: transparent; padding: 12px 11px; cursor: pointer; margin-bottom: 4px; }
    .nav-item:hover, .nav-item.active { background: var(--panel-2); border-color: var(--line); }
    .nav-item strong { display: block; font-size: 13px; line-height: 1.35; }
    .nav-item span { display: block; color: var(--muted); font-size: 11px; margin-top: 6px; }
    .detail { padding: 22px; min-width: 0; }
    .detail-head { display: flex; justify-content: space-between; gap: 20px; align-items: flex-start; margin-bottom: 18px; }
    .detail-head h2 { margin: 0 0 8px; font-size: 25px; letter-spacing: -.025em; }
    .detail-head p { color: var(--muted); margin: 0; font-size: 13px; }
    .status { border-radius: 999px; border: 1px solid var(--line); color: var(--muted); padding: 7px 11px; font-size: 12px; white-space: nowrap; }
    .status.provisional { color: var(--amber); border-color: rgba(255, 201, 121, .35); }
    .status.na { color: #b7c3d9; }
    .status.complete { color: var(--green); border-color: rgba(117, 216, 170, .35); }
    .players { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .video-card { min-width: 0; border: 1px solid var(--line); border-radius: 15px; overflow: hidden; background: #070a11; }
    .video-label { display: flex; justify-content: space-between; padding: 11px 13px; color: var(--muted); font-size: 12px; border-bottom: 1px solid var(--line-soft); }
    .video-label b { color: var(--text); font-weight: 650; }
    video { display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: contain; background: #05070c; }
    .video-missing { aspect-ratio: 16 / 9; display: grid; place-items: center; color: var(--muted); font-size: 13px; padding: 30px; text-align: center; }
    .controls { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 14px 0 20px; }
    .control-btn, .file-link { border: 1px solid var(--line); border-radius: 9px; background: #182239; padding: 9px 12px; cursor: pointer; text-decoration: none; font-size: 12px; }
    .control-btn:hover, .file-link:hover { border-color: var(--blue); background: #1d2b4a; }
    #seek { flex: 1; min-width: 180px; accent-color: var(--blue); }
    #clock { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 12px; min-width: 90px; text-align: right; }
    .analysis { display: grid; grid-template-columns: 280px minmax(0, 1fr); gap: 14px; }
    .panel { border: 1px solid var(--line); border-radius: 15px; background: rgba(14, 20, 33, .86); padding: 16px; min-width: 0; }
    .panel h3 { margin: 0 0 14px; font-size: 14px; }
    .score-overview { display: flex; align-items: center; gap: 15px; margin-bottom: 18px; }
    .ring { --score: 0; width: 92px; height: 92px; border-radius: 50%; display: grid; place-items: center; flex: 0 0 auto; background: conic-gradient(var(--blue) calc(var(--score) * 1%), #27344c 0); position: relative; }
    .ring::after { content: ""; position: absolute; inset: 8px; border-radius: 50%; background: #101729; }
    .ring b { z-index: 1; font-size: 21px; letter-spacing: -.04em; }
    .score-copy strong { display: block; font-size: 14px; margin-bottom: 5px; }
    .score-copy span { color: var(--muted); line-height: 1.5; font-size: 12px; }
    .dimension { margin-top: 13px; }
    .dimension-head { display: flex; justify-content: space-between; gap: 10px; color: var(--muted); font-size: 12px; margin-bottom: 6px; }
    .dimension-head b { color: var(--text); font-variant-numeric: tabular-nums; }
    .track { height: 7px; background: #26334b; border-radius: 99px; overflow: hidden; }
    .fill { height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--cyan), var(--blue)); }
    .dimension small { display: block; color: #71819e; margin-top: 5px; font-size: 10px; }
    .table-wrap { overflow: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 12px; min-width: 560px; }
    th { color: var(--muted); font-weight: 600; text-align: left; padding: 9px 8px; border-bottom: 1px solid var(--line); }
    td { padding: 10px 8px; border-bottom: 1px solid var(--line-soft); vertical-align: top; }
    td:first-child { color: var(--text); font-weight: 600; }
    .pill { display: inline-flex; align-items: center; gap: 5px; border-radius: 999px; padding: 4px 7px; font-size: 11px; background: #1d2940; color: var(--muted); }
    .pill.ok { color: var(--green); background: rgba(74, 169, 125, .12); }
    .pill.bad { color: var(--red); background: rgba(255, 111, 122, .11); }
    .pill.unknown { color: var(--amber); background: rgba(255, 194, 102, .11); }
    .diagnostics { margin-top: 14px; }
    .diag { display: flex; gap: 9px; padding: 9px 0; border-top: 1px solid var(--line-soft); color: var(--muted); font-size: 12px; line-height: 1.5; }
    .diag code { color: var(--amber); font-size: 11px; }
    .links { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
    .empty { color: var(--muted); font-size: 13px; line-height: 1.7; }
    .footer-note { color: #74829b; font-size: 12px; line-height: 1.7; margin-top: 22px; }
    .notice { padding: 12px 14px; margin-bottom: 16px; border: 1px solid rgba(255, 201, 121, .3); border-radius: 12px; background: rgba(255, 201, 121, .05); color: var(--amber); font-size: 12px; line-height: 1.7; }
    .notice p { margin: 0; }
    .notice ul { margin: 6px 0 0; padding-left: 18px; }
    .cell-btn { display: block; padding: 4px 0; border: 0; color: inherit; background: transparent; cursor: pointer; text-align: left; white-space: nowrap; }
    .cell-btn:hover .pill { outline: 1px solid var(--blue); }
    .object-jump { color: var(--cyan); background: transparent; border: 0; padding: 0; text-align: left; cursor: pointer; font-weight: 600; font-size: inherit; line-height: 1.5; }
    .object-jump:hover { text-decoration: underline; }
    .panel-hint { margin: -5px 0 10px; font-size: 11px; color: var(--muted); line-height: 1.6; }
    .check-detail { margin-top: 15px; border-top: 1px solid var(--line); padding-top: 15px; }
    .check-detail h4 { margin: 0 0 8px; font-size: 13px; }
    .check-detail p { color: var(--muted); font-size: 12px; line-height: 1.7; }
    .evidence-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .evidence-block { min-width: 0; }
    .evidence-block b { color: var(--cyan); font-size: 11px; }
    pre { background: #080e1a; padding: 12px; border-radius: 8px; border: 1px solid var(--line-soft); white-space: pre-wrap; word-break: break-word; overflow: auto; max-height: 240px; font: 11px/1.6 ui-monospace, SFMono-Regular, Consolas, monospace; }
    code { overflow-wrap: anywhere; }
    details { margin-top: 14px; }
    summary { cursor: pointer; color: var(--muted); font-size: 12px; }
    .video-error { padding: 8px 12px; color: var(--red); font-size: 12px; }
    @media (max-width: 760px) { .evidence-grid { grid-template-columns: 1fr; } }
    @media (max-width: 1100px) { .score-grid { grid-template-columns: repeat(3, 1fr); } .workspace { grid-template-columns: 190px minmax(0, 1fr); } .analysis { grid-template-columns: 1fr; } }
    @media (max-width: 760px) { .shell { width: min(100% - 24px, 680px); padding-top: 22px; } .hero { display: block; } .hero-note { margin-top: 18px; } .score-grid { grid-template-columns: 1fr 1fr; } .workspace { grid-template-columns: 1fr; } .case-nav { position: static; display: grid; grid-template-columns: 1fr 1fr; gap: 4px; } .nav-title { grid-column: 1 / -1; } .players { grid-template-columns: 1fr; } .detail { padding: 15px; } }
    @media (max-width: 450px) { .score-grid { grid-template-columns: 1fr; } .case-nav { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="shell">
    <header class="hero">
      <div>
        <div class="eyebrow">Code + Video Verifier / Object Contract v3</div>
        <h1>视频复刻与评分结果</h1>
        <p>左右同步对比原视频与复刻视频；查看六项评分，点击对象或分数，定位视频中的对象和对应源码证据。</p>
      </div>
      <div class="hero-note" id="hero-summary"><strong>4 条复刻视频</strong>正在读取最新评分…</div>
    </header>

    <section class="score-grid" id="score-grid" aria-label="案例评分"></section>

    <section class="workspace">
      <aside class="case-nav">
        <div class="nav-title">实验案例</div>
        <div id="case-nav"></div>
      </aside>

      <main class="detail" id="detail">
        <div class="empty">正在读取评分结果…</div>
      </main>
    </section>
    <div class="footer-note">评分来自源码检查，视频用于观察复刻差异。<a href="compare.html">历史视频对比</a> · “完整评分”表示本轮声明的检查均已得到结果。六项权重：存在 10% · 属性 15% · 关系 15% · 绑定 20% · 运动 25% · 时序 15%。表格中的“—”表示该对象没有声明对应检查。歌词与粒子的时间和集合测量已校准，<a href="experiments/object-contract-v3/README.md" target="_blank">查看检查范围与校准说明</a>。</div>
  </div>

  <script>
    const ROOT = 'experiments/object-contract-v3';
    const MEDIA = {"diffusion":{"reference":"media/object-contract-v3/b33c1fc77a8ec0eda23091cecd511c7dbf66aba6ccd84d5bae2460d184cf4ead.mp4","replica":"media/object-contract-v3/c33fc6df5611b623c9b6e2a935ee25b7eee4f927823aacb32fb60c76949a08ce.mp4"},"starry-night":{"reference":"media/object-contract-v3/f208f8ee71b594f087d9a4891ffcccc83365d516cb94c3bc089ae5df33e82cf4.mp4","replica":"media/object-contract-v3/a09464032a590d8172808abf3b72bb69d84320950a7b978a4dce5cd643161598.mp4"},"autumn-post":{"reference":"media/object-contract-v3/ee023aacc67f2018c95a3ca1979e74bdfaa4ebe685efb257cb1424a2578fe076.mp4","replica":"media/object-contract-v3/4d8ad44903032945dbebf861b9be868e92b29923379bff1d740ff35acb245f21.mp4"},"mimo-pipopipo":{"reference":"media/object-contract-v3/8fe0e5a4829997ccc27737fd6fcac514c36ec142aa5f4fa58dee1a49781df96a.mp4","replica":"media/object-contract-v3/188aadf29adea8d6f085047ad6515d44ed85404c797eaac3e043e3832f4125ab.mp4"}}; // Public exports replace this with same-origin media paths.
    const CASES = [
      { id: 'diffusion', title: '扩散与渗透：粒子运动', kind: '知识讲解', short: '粒子运动' },
      { id: 'starry-night', title: 'Starry Night：星夜画作揭示', kind: '艺术表达', short: '星夜揭示' },
      { id: 'autumn-post', title: '秋日邮局：水彩视觉短片', kind: '艺术表达', short: '秋日邮局' },
      { id: 'mimo-pipopipo', title: 'mimo：pipopipo 歌词 MV', kind: '叙事娱乐', short: '歌词 MV' },
    ];
    const state = { selected: 'diffusion', cases: new Map(), ref: null, replica: null, duration: 0, syncing: false };
    const $ = (s) => document.querySelector(s);
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const paths = (c) => ({
      score: `${ROOT}/evaluation-results/${c.id}/scores.json`,
      checks: `${ROOT}/evaluation-results/${c.id}/checks.json`,
      diagnostics: `${ROOT}/evaluation-results/${c.id}/diagnostics.json`,
      matches: `${ROOT}/evaluation-results/${c.id}/matches.json`,
      preflight: `${ROOT}/evaluation-results/${c.id}/reference-preflight.json`,
      objects: `${ROOT}/${c.id}/public/objects.json`,
      assets: `${ROOT}/${c.id}/public/assets.json`,
      instruction: `${ROOT}/${c.id}/public/instruction.md`,
      reference: MEDIA[c.id]?.reference || `${ROOT}/${c.id}/public/reference.mp4`,
      replica: MEDIA[c.id]?.replica || `${ROOT}/${c.id}/submission/output.mp4`,
      replicaCode: `${ROOT}/${c.id}/submission/src/Replica.tsx`,
    });
    async function json(url) {
      const r = await fetch(url, { cache: 'no-store' });
      if (!r.ok) throw new Error(`${r.status} ${url}`);
      return r.json();
    }
    async function loadCase(c) {
      const p = paths(c);
      const result = await Promise.allSettled([json(p.score), json(p.diagnostics), json(p.objects), json(p.assets)]);
      const value = (i, fallback) => result[i].status === 'fulfilled' ? result[i].value : fallback;
      if (result[0].status === 'rejected') throw result[0].reason;
      return { ...c, paths: p, score: value(0, {}), checks: [], diagnostics: value(1, []), matches: [], objects: value(2, []), assets: value(3, []), preflight: c.id !== 'theneo', detailsLoaded: false };
    }
    async function loadDetails(c) {
      if (c.detailsLoaded) return;
      if (!c.detailsPromise) c.detailsPromise = Promise.all([json(c.paths.checks), json(c.paths.matches)]).then(([checks,matches]) => {
        c.checks = checks; c.matches = matches; c.detailsLoaded = true;
      }).catch(err => { c.detailsPromise = null; throw err; });
      await c.detailsPromise;
    }
    function scoreText(c) { return c.score.total == null ? '—' : Number(c.score.total).toFixed(1); }
    function statusText(s) { return s === 'provisional' ? '评分待补齐' : s === 'complete' ? '完整评分' : s === 'not_applicable' ? '暂无源码评分' : s === 'invalid_submission' ? '提交无效' : s === 'evaluation_error' ? '评分出错' : s || '未知状态'; }
    function scoreClass(c) { return c.score.total == null ? 'na' : Number(c.score.total) < 55 ? 'low' : ''; }
    function renderScoreGrid() {
      $('#score-grid').innerHTML = CASES.map(c => {
        const item = state.cases.get(c.id) || c;
        const active = state.selected === c.id ? ' active' : '';
        return `<button class="score-card${active}" data-case="${c.id}"><div class="kind">${esc(c.kind)}</div><h3>${esc(c.title)}</h3><div class="score-line"><span class="score-value ${scoreClass(item)}">${scoreText(item)}</span><span class="coverage">${coverageText(item)}</span></div><div class="card-status">${statusText(item.score.status)}${item.score.provisional_total == null ? '' : ` · 暂定参考值 ${fmt(item.score.provisional_total)}`}</div></button>`;
      }).join('');
      $('#score-grid').querySelectorAll('[data-case]').forEach(b => b.onclick = () => selectCase(b.dataset.case));
    }
    function coverageText(c) {
      const x = c.score.coverage || {};
      return x.declared ? `${x.resolved}/${x.declared} 项已解析` : statusText(c.score.status);
    }
    function renderNav() {
      $('#case-nav').innerHTML = CASES.map(c => { const x = state.cases.get(c.id) || c; return `<button class="nav-item${state.selected === c.id ? ' active' : ''}" data-case="${c.id}"><strong>${esc(c.short)}</strong><span>${x.score.total == null ? statusText(x.score.status) : `${scoreText(x)} 分`} · ${coverageText(x)}</span></button>`; }).join('');
      $('#case-nav').querySelectorAll('[data-case]').forEach(b => b.onclick = () => selectCase(b.dataset.case));
    }
    function dimName(d) { return ({presence:'对象存在', attributes:'元素属性', relations:'相对关系', binding:'动效绑定', motion:'运动参数', timing:'进出时序'})[d] || d; }
    function fmt(v) { return v == null || Number.isNaN(Number(v)) ? '—' : Number(v).toFixed(1); }
    function pill(status, reason = '') {
      const cls = status === 'ok' ? 'ok' : status === 'missing' ? 'bad' : 'unknown';
      const text = status === 'ok' ? '已算出' : status === 'missing' ? '缺失' : reason.includes('needs calibration') ? '待校准' : status === 'unsupported' ? '暂不支持' : status === 'unresolved' ? '待确认' : status || '未知';
      return `<span class="pill ${cls}" title="${esc(explainReason(reason))}">${text}</span>`;
    }
    function explainReason(reason) {
      if (String(reason).includes('reference property is static')) return '原作在设定的动作时间段内，该属性没有变化；需要重新确认检查的属性和时间段，才能评价复刻的绑定。';
      if (String(reason).includes('numeric property is unresolved')) return '当前解析器无法取得该属性的数值。';
      return reason || '';
    }
    function checksFor(c, objectId, dimension) { return c.checks.filter(x => x.object_id === objectId && x.dimension === dimension); }
    function dimensionCell(c, objectId, dimension) {
      const rows = checksFor(c, objectId, dimension);
      if (!rows.length) return '<span class="pill">—</span>';
      const unresolved = rows.find(x => x.status !== 'ok');
      const avg = rows.filter(x => ['ok','missing'].includes(x.status) && x.score != null);
      const score = avg.length ? avg.reduce((s,x) => s + Number(x.score), 0) / avg.length : null;
      return `<button class="cell-btn" data-object="${esc(objectId)}" data-dimension="${dimension}" aria-label="查看 ${esc(objectId)} 的${dimName(dimension)}检查">${pill(unresolved ? unresolved.status : 'ok', unresolved?.reason)} ${score == null ? '' : `<span class="coverage">${rows.length > 1 ? '均值 ' : ''}${fmt(score)}</span>`}${rows.length > 1 ? `<br><span class="coverage">${avg.length}/${rows.length} 项可评</span>` : ''}</button>`;
    }
    function renderDetails(c) {
      const score = c.score || {};
      const total = score.total == null ? null : Number(score.total);
      const dimensions = score.dimensions || {};
      const ring = total == null ? 0 : Math.max(0, Math.min(100, total));
      const cov = score.coverage || {};
      const objectRows = (c.objects.length ? c.objects : [...new Set(c.checks.map(x => x.object_id))].map(id => ({id, label:id}))).map(o => {
        const cells = ['presence','attributes','relations','binding','motion','timing'].map(d => `<td>${dimensionCell(c, o.id, d)}</td>`).join('');
        return `<tr><td><button class="object-jump" data-time="${Number(o.anchor_seconds) || 0}">${esc(o.label || o.id)}</button><br><code>${esc(o.id)}</code>${o.anchor_seconds == null ? '' : `<br><span class="coverage">定位到 ${fmt(o.anchor_seconds)} 秒</span>`}</td>${cells}</tr>`;
      }).join('');
      const diag = (c.diagnostics || []).map(d => `<div class="diag"><code>${esc(d.code || 'info')}</code><span>${esc(d.message || d.reason || d)}</span></div>`).join('');
      const note = score.status === 'not_applicable' ? '没有可确认的原作 Remotion 源码。' : score.reason || `已算出 ${cov.resolved || 0} / ${cov.declared || 0} 项${score.provisional_total == null ? '。' : `；暂定参考值 ${fmt(score.provisional_total)}，完整总分待补齐。`}`;
      const pending = c.checks.filter(x => !['ok','missing'].includes(x.status));
      const notice = pending.length ? `<div class="notice"><p><b>${pending.length} 项检查待处理</b> · ${esc(explainReason(pending[0].reason))}</p><ul>${pending.map(x => `<li>${esc(c.objects.find(o => o.id === x.object_id)?.label || x.object_id)} · ${dimName(x.dimension)}${x.reason === pending[0].reason ? '' : `：${esc(explainReason(x.reason))}`}</li>`).join('')}</ul></div>` : score.status === 'not_applicable' ? `<div class="notice">${esc(score.reason)}</div>` : '';
      const dimOrder = ['presence','attributes','relations','binding','motion','timing'];
      const defaultWeights = {presence:10,attributes:15,relations:15,binding:20,motion:25,timing:15};
      const dims = dimOrder.map(d => `<div class="dimension"><div class="dimension-head"><span>${dimName(d)}</span><b>${fmt(dimensions[d])}</b></div><div class="track"><div class="fill" style="width:${dimensions[d] == null ? 0 : Math.max(0, Math.min(100, dimensions[d]))}%"></div></div><small>权重 ${score.weights && score.weights[d] != null ? Number(score.weights[d] * 100).toFixed(0) : defaultWeights[d]}%</small></div>`).join('');
      $('#detail').innerHTML = `
        <div class="detail-head"><div><h2>${esc(c.title)}</h2><p>${esc(c.kind)} · 首次盲复刻 · ${c.assets.length} 个公开素材</p></div><span class="status ${score.status === 'provisional' ? 'provisional' : score.status === 'complete' ? 'complete' : 'na'}">${statusText(score.status)}</span></div>
        <div class="players"><article class="video-card"><div class="video-label"><b>原视频</b><span>reference.mp4</span></div><video id="reference-video" controls playsinline muted preload="metadata" src="${c.paths.reference}"></video></article><article class="video-card"><div class="video-label"><b>Remotion 复刻</b><span>output.mp4</span></div><video id="replica-video" controls playsinline muted preload="metadata" src="${c.paths.replica}"></video></article></div>
        <div class="controls"><button class="control-btn" id="play-toggle">同步播放</button><button class="control-btn" id="frame-back">− 1 帧</button><button class="control-btn" id="frame-forward">+ 1 帧</button><input id="seek" type="range" min="0" max="1" step="0.001" value="0"><span id="clock">0.00 / 0.00 s</span></div>
        ${notice}
        <div class="analysis"><section class="panel"><h3>评分概览</h3><div class="score-overview"><div class="ring" style="--score:${ring}"><b>${total == null ? '—' : fmt(total)}</b></div><div class="score-copy"><strong>${statusText(score.status)}</strong><span>${esc(note)}</span></div></div>${dims}</section><section class="panel"><h3>对象与检查项</h3><p class="panel-hint">点击对象定位视频，点击分数查看检查证据。“已算出”表示得到评分；分数为 0 仍表示有差异。多项检查的均值仅用于展示。</p><div class="table-wrap"><table><thead><tr><th>对象</th><th>存在</th><th>属性</th><th>关系</th><th>绑定</th><th>运动</th><th>时序</th></tr></thead><tbody>${objectRows || '<tr><td colspan="7" class="empty">暂无对象检查</td></tr>'}</tbody></table></div><div id="check-evidence"></div>${diag ? `<details><summary>源码解析诊断（${c.diagnostics.length} 条）</summary>${diag}</details>` : ''}<div class="links"><a class="file-link" href="${c.paths.score}" target="_blank">评分 JSON</a><a class="file-link" href="${c.paths.checks}" target="_blank">检查 JSON</a><a class="file-link" href="${c.paths.matches}" target="_blank">对象匹配</a>${c.preflight ? `<a class="file-link" href="${c.paths.preflight}" target="_blank">原作预检查</a>` : ''}<a class="file-link" href="${c.paths.instruction}" target="_blank">任务说明</a><a class="file-link" href="${c.paths.replicaCode}" target="_blank">复刻源码</a></div></section></div>`;
      bindPlayers(c);
      $('#detail').querySelectorAll('.cell-btn').forEach(b => b.onclick = () => showEvidence(c, b.dataset.object, b.dataset.dimension));
      $('#detail').querySelectorAll('.object-jump').forEach(b => b.onclick = () => { state.setTime(Number(b.dataset.time)); $('#reference-video').scrollIntoView({behavior:'smooth',block:'center'}); });
    }
    function showEvidence(c, objectId, dimension) {
      const label = c.objects.find(o => o.id === objectId)?.label || objectId;
      const rows = checksFor(c, objectId, dimension);
      const evidence = rows.map(row => {
        const sources = ['reference_code','replica_code'].map(type => {
          const items = (row.evidence || []).filter(e => e.type === type);
          return `<div class="evidence-block"><b>${type === 'reference_code' ? '原作源码' : '复刻源码'}</b>${items.map(e => `<p>${esc(e.file)}:${e.line || ''}</p><pre>${esc(e.expression || '')}</pre>`).join('') || '<p>这项检查没有源码片段。</p>'}</div>`;
        }).join('');
        const samples = ['reference_values','replica_values'].map(key => `<div class="evidence-block"><b>${key === 'reference_values' ? '原作采样值' : '复刻采样值'}</b><pre>${esc(JSON.stringify(row[key] || [], null, 2))}</pre></div>`).join('');
        return `<article class="check-detail"><h4>${esc(row.id)} · ${pill(row.status,row.reason)} ${row.score == null ? '' : `${fmt(row.score)} 分`}</h4>${row.reason ? `<p>${esc(explainReason(row.reason))}</p>` : `<p>测量误差：${esc(row.error ?? '—')}</p>`}<div class="evidence-grid">${sources}</div>${row.reference_values?.length || row.replica_values?.length ? `<details><summary>查看采样时间和数值</summary><div class="evidence-grid">${samples}</div></details>` : ''}</article>`;
      }).join('');
      $('#check-evidence').innerHTML = `<div class="check-detail"><h3>${esc(label)} · ${dimName(dimension)}</h3>${evidence}</div>`;
      $('#check-evidence').scrollIntoView({behavior:'smooth',block:'nearest'});
    }
    function bindPlayers(c) {
      const ref = $('#reference-video'), replica = $('#replica-video');
      state.ref = ref; state.replica = replica; state.duration = 0; state.syncing = false;
      let replicaSeekTarget = null;
      const active = () => state.ref === ref;
      const clampReplicaTime = t => Math.min(t, Number.isFinite(replica.duration) ? replica.duration : t);
      const follow = t => { const target = clampReplicaTime(t); if (Math.abs(replica.currentTime - target) > .08) { replicaSeekTarget = target; replica.currentTime = target; } };
      const updateDuration = () => { if (!active()) return; const d = Number.isFinite(ref.duration) ? ref.duration : (Number.isFinite(replica.duration) ? replica.duration : 0); state.duration = d; $('#seek').max = d || 1; $('#clock').textContent = `${ref.currentTime.toFixed(2)} / ${(d || 0).toFixed(2)} s`; };
      const showTime = (t) => { $('#seek').value = Math.max(0, Math.min(state.duration || 0, t)); $('#clock').textContent = `${t.toFixed(2)} / ${(state.duration || 0).toFixed(2)} s`; };
      const syncReplica = () => { if (!active() || state.syncing) return; follow(ref.currentTime); showTime(ref.currentTime); };
      const seekTo = (t) => { if (!active()) return; const safe = Math.max(0, Math.min(state.duration || 0, Number(t) || 0)); ref.currentTime = safe; follow(safe); showTime(safe); };
      const pauseBoth = () => { if (!active() || state.syncing) return; state.syncing = true; ref.pause(); replica.pause(); state.syncing = false; $('#play-toggle').textContent = '同步播放'; };
      const setTime = t => { pauseBoth(); seekTo(t); };
      state.setTime = setTime;
      const playBoth = async () => {
        if (!active() || state.syncing) return;
        state.syncing = true;
        if (ref.currentTime >= state.duration - .02) seekTo(0);
        follow(ref.currentTime);
        const results = await Promise.allSettled([ref.play(), replica.play()]);
        if (!active()) return;
        state.syncing = false;
        if (results.some(x => x.status === 'rejected')) pauseBoth();
        else $('#play-toggle').textContent = '同步暂停';
      };
      ref.addEventListener('loadedmetadata', updateDuration); replica.addEventListener('loadedmetadata', updateDuration);
      ref.addEventListener('timeupdate', syncReplica); ref.addEventListener('seeking', syncReplica);
      ref.addEventListener('play', () => { if (!state.syncing) playBoth(); });
      ref.addEventListener('pause', pauseBoth); ref.addEventListener('ended', pauseBoth);
      replica.addEventListener('play', () => { if (!state.syncing) playBoth(); });
      replica.addEventListener('pause', () => { if (!replica.ended) pauseBoth(); });
      replica.addEventListener('seeking', () => {
        if (!active() || state.syncing || (replicaSeekTarget != null && Math.abs(replica.currentTime - replicaSeekTarget) < .05)) return;
        if (Math.abs(ref.currentTime - replica.currentTime) > .08) { ref.currentTime = replica.currentTime; showTime(ref.currentTime); }
      });
      replica.addEventListener('seeked', () => { replicaSeekTarget = null; });
      [ref,replica].forEach(v => v.addEventListener('error', () => { const error = document.createElement('div'); error.className = 'video-error'; error.textContent = '视频加载失败，请刷新页面重试。'; v.parentElement.append(error); }));
      $('#seek').oninput = () => setTime($('#seek').value);
      $('#play-toggle').onclick = () => ref.paused ? playBoth() : pauseBoth();
      const step = (delta) => setTime(ref.currentTime + delta / 30);
      $('#frame-back').onclick = () => step(-1); $('#frame-forward').onclick = () => step(1);
    }
    async function selectCase(id) {
      const c = state.cases.get(id); if (!c) return;
      state.ref?.pause(); state.replica?.pause(); state.selected = id;
      renderScoreGrid(); renderNav(); history.replaceState(null, '', `#${id}`);
      if (!c.detailsLoaded) $('#detail').innerHTML = '<div class="empty">正在读取该案例的评分证据…</div>';
      try { await loadDetails(c); if (state.selected === id) renderDetails(c); }
      catch (err) { if (state.selected === id) $('#detail').innerHTML = `<div class="empty">评分证据加载失败：${esc(err.message)}。请点击案例重试。</div>`; }
    }
    async function init() {
      if (location.protocol === 'file:') throw new Error('请通过网页地址访问本页');
      const loaded = await Promise.all(CASES.map(loadCase)); loaded.forEach(c => state.cases.set(c.id, c));
      const complete = loaded.filter(c => c.score.status === 'complete').length;
      const pending = loaded.filter(c => c.score.status === 'provisional').length;
      $('#hero-summary').innerHTML = `<strong>${loaded.length} 条复刻视频</strong>${complete} 条完整评分 · ${pending} 条评分待补齐 · ${loaded.length - complete - pending} 条仅视频对比`;
      const hash = location.hash.slice(1); if (state.cases.has(hash)) state.selected = hash; await selectCase(state.selected);
    }
    init().catch(err => { $('#detail').innerHTML = `<div class="empty">读取展示数据失败：${esc(err.message)}<br>请刷新页面重试，或检查网络连接。</div>`; });
  </script>
</body>
</html>
